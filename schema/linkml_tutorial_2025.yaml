name: linkml-tutorial-2025
description: This is a demo schema for use in training LinkML Schema developers in
  key LinkML model and build features.
title: linkml-tutorial-2025
id: https://w3id.org/linkml/linkml-tutorial-2025
imports:
- linkml:types
license: MIT
prefixes:
  linkml_tutorial_2025:
    prefix_prefix: linkml_tutorial_2025
    prefix_reference: https://w3id.org/linkml/linkml-tutorial-2025/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  example:
    prefix_prefix: example
    prefix_reference: https://example.org/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  ENVO:
    prefix_prefix: ENVO
    prefix_reference: http://purl.obolibrary.org/obo/ENVO_
  PO:
    prefix_prefix: PO
    prefix_reference: http://purl.obolibrary.org/obo/PO_
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  NCBITaxon:
    prefix_prefix: NCBITaxon
    prefix_reference: http://purl.obolibrary.org/obo/NCBITaxon_
  NCIT:
    prefix_prefix: NCIT
    prefix_reference: http://purl.obolibrary.org/obo/NCIT_
  SIO:
    prefix_prefix: SIO
    prefix_reference: http://semanticscience.org/resource/SIO_
default_prefix: linkml_tutorial_2025
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  SampleContainerEnum:
    name: SampleContainerEnum
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/SampleContainerEnum
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    permissible_values:
      tube:
        text: tube
        description: Sample provided in a tube
      plate:
        text: plate
        description: Sample provided in a plate
  PloidyEnum:
    name: PloidyEnum
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/PloidyEnum
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    permissible_values:
      haploid:
        text: haploid
        meaning: PATO:0001393
      diploid:
        text: diploid
        meaning: PATO:0001394
      triploid:
        text: triploid
        meaning: PATO:0001395
      tetraploid:
        text: tetraploid
        meaning: PATO:0001396
      allopolyploid:
        text: allopolyploid
        meaning: PATO:0001392
  NCBITaxonEnum:
    name: NCBITaxonEnum
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/NCBITaxonEnum
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    reachable_from:
      source_ontology: obo:ncbitaxon
  TissueTypeEnum:
    name: TissueTypeEnum
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/TissueTypeEnum
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    reachable_from:
      source_ontology: obo:po
      source_nodes:
      - PO:0025131
      relationship_types:
      - rdfs:subClassOf
      include_self: false
slots:
  id:
    name: id
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/id
    description: Sample ID (No Edit) - prefilled identifier
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: integer
    required: true
  sample_container:
    name: sample_container
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/sample_container
    description: Select tube or plate
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:sample_container
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: SampleContainerEnum
    required: true
  plate_location:
    name: plate_location
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/plate_location
    description: Required if samples provided in a plate. For partial plates, fill
      by columns. Leave blank if the sample will be shipped in a tube (e.g., B1)
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:plate_location
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: string
    pattern: ^[A-H][1-9][0-2]?$
  strain_variety_cultivar:
    name: strain_variety_cultivar
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/strain_variety_cultivar
    description: Name or ID of the cultivar, variety, strain, or other similar designation
      of the primary organism being sampled
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:strain_variety_cultivar
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: string
    required: true
  isolate:
    name: isolate
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/isolate
    description: Isolate or mutant name
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:isolate
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: string
  ncbi_taxonomy_id:
    name: ncbi_taxonomy_id
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/ncbi_taxonomy_id
    description: Unique identifier from the NCBI taxonomy database
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:ncbi_taxonomy_id
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: NCBITaxonEnum
    required: true
  ploidy:
    name: ploidy
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/ploidy
    description: The ploidy level of the genome (e.g. allopolyploid, haploid, diploid,
      triploid, tetraploid). For terms, select terms listed under class ploidy (PATO:001374)
      of Phenotypic Quality Ontology (PATO)
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    mappings:
    - PATO:0001374
    exact_mappings:
    - PATO:0001374
    - NCIT:C17001
    - SIO:010278
    slot_uri: PATO:0001374
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: PloidyEnum
  collection_date_time:
    name: collection_date_time
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/collection_date_time
    description: The time of sampling, either as an instance (single point in time)
      or interval. In case no exact time is available, the date/time can be right
      truncated. All times must be I SO8601 compliant
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:collection_date_time
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: datetime
    required: true
  sample_size:
    name: sample_size
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/sample_size
    description: The total amount or size (volume (ml), mass (g) or area (m2)) of
      sample collected. Separate the number and unit by a single space
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:sample_size
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: string
    required: true
    pattern: ^[0-9]+(\.[0-9]+)?\s+(g|ml|m2)$
  tissue:
    name: tissue
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/tissue
    description: Detailed description of the organ or type of tissue sampled (e.g.
      unopened flower buds with 1mm petal visible, 5 mm lateral root tips, 4th leaf
      fully expanded)
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:tissue
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: string
    required: true
  tissue_plant_ontology_term:
    name: tissue_plant_ontology_term
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/tissue_plant_ontology_term
    description: Plant ontology term corresponding to plant structure sampled. May
      include multiple terms separated by semicolons. See https://planteome.org
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:tissue_plant_ontology_term
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: TissueTypeEnum
  depth_meters:
    name: depth_meters
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/depth_meters
    description: The vertical distance (in meters) below local surface. For sediment
      or soil samples depth is measured from sediment or soil surface, respectively.
      Depth can be reported as an interval for subsurface samples
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:depth_meters
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: float
  elevation_meters:
    name: elevation_meters
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/elevation_meters
    description: Elevation (in meters) of the sampling site as measured by the vertical
      distance from mean sea level
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:elevation_meters
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: float
  broad_scale_environmental_context:
    name: broad_scale_environmental_context
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/broad_scale_environmental_context
    description: The major environmental system the sample or specimen came from.
      The system(s) identified should have a coarse spatial grain, to provide the
      big contextualising environment of where the sampling was done (e.g. in the
      desert or a rainforest). See https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:broad_scale_environmental_context
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: uriorcurie
  local_environmental_context:
    name: local_environmental_context
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/local_environmental_context
    description: The entity or entities which are in the sample or specimen's local
      vicinity and which you believe have significant causal influences on your sample
      or specimen. The terms used here should be countable things (e.g. a rock, a
      snow crystal, a cave, a hydrothermal vent) of smaller spatial grain than your
      entry for broad-scale environmental context. See https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:local_environmental_context
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: uriorcurie
  environmental_medium:
    name: environmental_medium
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/environmental_medium
    description: The environmental material(s) immediately surrounding the sample
      or specimen at the time of sampling. These should be mass/volume nouns (e.g.
      air, water) and not discrete, countable entities (e.g. a tree, a leaf, a table
      top). See https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slot_uri: linkml_tutorial_2025:environmental_medium
    owner: PlantTissueSample
    domain_of:
    - PlantTissueSample
    range: uriorcurie
classes:
  PlantTissueSample:
    name: PlantTissueSample
    definition_uri: https://w3id.org/linkml/linkml-tutorial-2025/PlantTissueSample
    description: Plant tissue sample metadata including collection, taxonomic, and
      environmental information
    from_schema: https://w3id.org/linkml/linkml-tutorial-2025
    slots:
    - id
    - sample_container
    - plate_location
    - strain_variety_cultivar
    - isolate
    - ncbi_taxonomy_id
    - ploidy
    - collection_date_time
    - sample_size
    - tissue
    - tissue_plant_ontology_term
    - depth_meters
    - elevation_meters
    - broad_scale_environmental_context
    - local_environmental_context
    - environmental_medium
    class_uri: linkml_tutorial_2025:PlantTissueSample
metamodel_version: 1.7.0
